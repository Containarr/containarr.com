<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Containarr — Open Graph image</title>
  <!-- Capture a 1200 × 630 viewport at deviceScaleFactor: 2 to og-image.png. -->
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; background: #09090b; }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      background: radial-gradient(ellipse at 79% 48%, #102c4b 0, #0c1521 36%, #09090b 74%);
    }
    main { height: 100%; display: grid; grid-template-columns: 510px 1fr; gap: 42px; padding: 52px; }
    .intro { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
    .brand { display: flex; align-items: center; gap: 14px; font-size: 29px; font-weight: 650; letter-spacing: -.8px; }
    .brand img { width: 62px; height: 62px; object-fit: contain; }
    h1 { margin: 49px 0 21px; font-size: 57px; line-height: 1.06; font-weight: 750; letter-spacing: -2.5px; }
    h1 span { color: #8bbfff; white-space: nowrap; }
    .copy { margin: 0; max-width: 365px; color: #a9b0bc; font-size: 21px; line-height: 1.5; }
    .features { display: flex; gap: 17px; margin-top: 28px; color: #d5dce6; font-size: 15px; }
    .features span { display: flex; align-items: center; gap: 7px; }
    .features svg { width: 18px; height: 18px; color: #8bbfff; }
    .apps { align-self: center; display: grid; gap: 16px; }
    .app { border: 1px solid #30343c; border-radius: 12px; background: #191c21; overflow: hidden; }
    .app-main { min-height: 72px; display: flex; align-items: center; gap: 12px; padding: 15px 17px; }
    .app-icon { width: 40px; height: 40px; object-fit: contain; flex: none; }
    .app-icon-plex { padding: 4px; border-radius: 8px; background: #f4f4f5; }
    h3 { margin: 0; font-size: 18px; font-weight: 580; letter-spacing: -.25px; white-space: nowrap; }
    .status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; flex: none; padding: 5px 9px; border: 1px solid #17614c; border-radius: 99px; background: #0c3026; color: #52dfa9; font-size: 13px; font-weight: 550; white-space: nowrap; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #34d399; }
    .pending { border-color: #695122; background: #342b18; color: #f3c76a; }
    .pending::before { width: 10px; height: 10px; border: 1.5px solid #8c7135; border-top-color: #f3c76a; border-right-color: #f3c76a; background: none; transform: rotate(25deg); }
    .address { display: flex; align-items: center; gap: 8px; padding: 11px 18px; border-top: 1px solid #2a2e35; color: #a7b1be; font-size: 14px; }
    .address svg { width: 14px; height: 14px; color: #738195; }
    .address .https { color: #dde4ed; }
    svg { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  </style>
</head>
<body>
  <main>
    <section class="intro">
      <div class="brand"><img src="assets/logo.png" alt=""><span>Containarr</span></div>
      <h1>Your homelab.<br><span>Powerful &amp; Easy.</span></h1>
      <p class="copy">Install, update, and securely access all your Docker apps.</p>
      <div class="features">
        <span><svg viewBox="0 0 24 24"><path d="m9 12 2 2 4-4"/><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/></svg>Automatic HTTPS</span>
        <span><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></svg>Self-hosted</span>
      </div>
    </section>
    <section class="apps" aria-label="Example Containarr apps">
      <article class="app">
        <div class="app-main"><img class="app-icon app-icon-plex" src="assets/plex.png" alt="Plex icon"><h3>Plex Media Server</h3><span class="status">Live</span></div>
        <div class="address"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span><span class="https">https://</span>plex.mydomain.com</span></div>
      </article>
      <article class="app">
        <div class="app-main"><img class="app-icon" src="assets/sonarr.png" alt="Sonarr icon"><h3>Sonarr</h3><span class="status">Live</span></div>
        <div class="address"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span><span class="https">https://</span>sonarr.mydomain.com</span></div>
      </article>
      <article class="app">
        <div class="app-main"><img class="app-icon" src="assets/homey.png" alt="Homey icon"><h3>Homey</h3><span class="status pending">Provisioning Certificate...</span></div>
        <div class="address"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a18 18 0 0 1 0 18 18 18 0 0 1 0-18"/></svg><span><span class="https">https://</span>homey.mydomain.com</span></div>
      </article>
    </section>
  </main>
</body>
</html>
